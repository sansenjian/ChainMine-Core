buildscript {
    repositories {
        maven { url = "https://maven.aliyun.com/repository/central" }
        maven { url = "https://maven.aliyun.com/repository/central" }
    mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
    dependencies {
        classpath "me.shedaniel:architectury-plugin:3.5.169"
    }
}
plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.17.491'
}

apply plugin: 'architectury-plugin'

base {
    archivesName = 'chainmine-core-common'
}

version = project.mod_version
group = project.maven_group

architectury {
    common("fabric", "neoforge")
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.aliyun.com/repository/central" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 单元测试（纯逻辑，不依赖 Minecraft 运行时）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

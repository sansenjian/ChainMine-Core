name: Test

on:
  push:
    branches: [ main, mc-1.21.2plus ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Unit tests (common)
        run: ./gradlew :common:test --no-daemon --no-parallel

      - name: Fabric build + remap check
        run: ./gradlew :fabric:build --no-daemon --no-parallel

      - name: Verify fabric JAR contains common classes
        run: |
          unzip -l fabric/build/libs/chainmine-core-*.jar | grep -c "com/chainmine/core/" || (echo "common classes missing from fabric JAR" && exit 1)

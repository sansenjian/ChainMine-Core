buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
    dependencies {
        classpath "me.shedaniel:architectury-plugin:3.5.169"
    }
}
plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.17.491'
}

apply plugin: 'architectury-plugin'

base {
    archivesName = 'chainmine-core'
}

version = project.mod_version
group = project.maven_group

architectury {
    fabric()
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    mavenCentral()
}

dependencies {
    // 共享核心：依赖 common 的 architectury 转换产物（transformProductionFabric），
    // shade 进 jar 后由 remapJar 统一 remap 到 intermediary
    implementation project(path: ':common', configuration: 'transformProductionFabric')

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"


    // 单元测试
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// 打包 common 转换产物进 jar（remapJar 统一 remap 到 intermediary）
configurations {
    commonTransform
}

dependencies {
    commonTransform project(path: ':common', configuration: 'transformProductionFabric')
}

jar {
    from(configurations.commonTransform.collect { it.isDirectory() ? it : zipTree(it) })
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    // 不拆分 client source set：保持单 source set 简单结构。
    // ChainMineClient 类仅在客户端 entrypoint 被加载，服务端不会触碰。

    runs {
        gametest {
            server()
            name = "GameTest"
            // fabric-api 的 GameTest 开关：服务端启动后自动跑 @GameTest 用例
            vmArg "-Dfabric-api.gametest=1"
        }
    }
}

test {
    useJUnitPlatform()
}

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://files.minecraftforge.net/maven/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
    dependencies {
        classpath "me.shedaniel:architectury-plugin:3.5.169"
        classpath "net.neoforged.gradle:userdev:7.1.38"
    }
}
plugins {
    id 'java'
}

apply plugin: 'net.neoforged.gradle.userdev'
apply plugin: 'architectury-plugin'

base {
    archivesName = 'chainmine-core-neoforge'
}

version = project.mod_version
group = project.maven_group

architectury {
    neoForge()
}

repositories {
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.neoforged.net/releases/" }
    mavenCentral()
}

dependencies {
    neoForge "net.neoforged:neoforge:21.11.45"

    // 共享核心（common 模块；architectury 在构建时把 yarn 字节码 remap 到 mojmap）
    implementation project(':common')
}

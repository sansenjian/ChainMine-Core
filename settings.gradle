pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven { url = "https://maven.aliyun.com/repository/central" }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'chainmine-core'

// MultiLoader 结构：common（共享核心）+ fabric + neoforge（加载器封装）
include 'common', 'fabric'
// include 'neoforge' // 本地构建：取消注释 + ./gradlew :neoforge:build（配方见 docs/NEOFORGE-BUILD.md）
